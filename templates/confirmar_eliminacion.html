{% extends "base.html" %}

{% block title %}Eliminar {{ tipo_entidad }} | Taller{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger shadow-sm">
      <div class="card-header bg-danger text-white fw-bold py-3">Eliminar {{ tipo_entidad }}</div>
      <div class="card-body p-4">
        <p class="mb-4">¿Está seguro de que desea eliminar <strong>{{ objeto }}</strong>?</p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_cancelar }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger fw-bold">Confirmar eliminación</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
